; =============================================================================
;  firmware_esp32 — Robot 2WD vi sai + LiDAR, micro-ROS (ROS 2 Humble)
;  Kết nối không dây hoàn toàn qua Wi-Fi UDP tới Laptop:
;    * micro-ROS agent : UDP 8888  (/cmd_vel, /odom, /joint_states, /tf)
;    * LiDAR bridge    : UDP 8889  (gói nhị phân 1 vòng quét 360°)
;
;  Build      : pio run
;  Nạp        : pio run -t upload
;  Serial     : pio device monitor
;  Unit test  : pio test -e native        (logic thuần, chạy trên PC)
;  Sau khi đổi distro / colcon meta / extra_packages: pio run -t clean_microros
; =============================================================================

[platformio]
default_envs = esp32dev

; -----------------------------------------------------------------------------
;  ESP32-WROOM-32 (esp32dev) — firmware chính
; -----------------------------------------------------------------------------
[env:esp32dev]
; espressif32 6.x = Arduino-ESP32 core 2.0.17 (ESP-IDF 4.4): dòng ổn định mà
; micro_ros_platformio hỗ trợ. Không nâng lên 7.x/8.x (Arduino core 3.x) khi
; chưa kiểm tra lại micro-ROS.
platform = espressif32 @ 6.13.0
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; ---- micro-ROS ----
board_microros_distro = humble
board_microros_transport = wifi

lib_deps =
    ; Ghim commit để build lặp lại được (nhánh main, 2025-09-17)
    https://github.com/micro-ROS/micro_ros_platformio.git#cfee17faffaa532363b7151dd13af6a85c69d3c1
    ; kaiaai/LDS: ghim commit đã có bản sửa kiểm tra checksum gói Camsense X1
    ; (bản 0.6.3 trên registry chưa có). Có thể thay bằng: kaiaai/LDS @ 0.6.3
    https://github.com/kaiaai/LDS.git#6e17803760908b3898d3b7f3f912e8c4f8b7bafd

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    ; Log nội bộ của Arduino-ESP32: 0=tắt 1=error 2=warn 3=info
    -DCORE_DEBUG_LEVEL=1
build_src_flags =
    -Wall
    -Wextra

; -----------------------------------------------------------------------------
;  Unit test trên PC (không cần ESP32): pio test -e native
;  Chỉ build lib/amr_core (PID, động học, giải mã encoder, đóng gói LiDAR).
; -----------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -DUNITY_INCLUDE_DOUBLE
    -Wall
    -Wextra
    -Werror
